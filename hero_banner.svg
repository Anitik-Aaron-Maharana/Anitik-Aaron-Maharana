<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anitik Aaron Maharana — coder, multi-instrumentalist, B.Tech CSE (AI and ML) student">
  <style>
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes eq { 0%, 100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes drift { 0% { transform: translateX(0) } 100% { transform: translateX(40px) } }
    @keyframes hop { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
    .cursor { animation: blink 1.1s step-end infinite; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1.4s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .drift { animation: drift 9s ease-in-out infinite alternate; }
    .hop { animation: hop 1.2s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030817"/>
      <stop offset="55%" stop-color="#0b1a3d"/>
      <stop offset="100%" stop-color="#050b1f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf8"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#60a5fa" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <g class="drift"><ellipse cx="220" cy="80" rx="300" ry="170" fill="url(#blobA)"/></g>
  <ellipse cx="1010" cy="250" rx="320" ry="160" fill="url(#blobB)"/>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="#1e3a8a" stroke-width="2"/>

  <!-- window bar -->
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="6" fill="#27c93f"/>
  <text x="92" y="33" class="mono" font-size="13" fill="#6b7fa6">~/anitik/sketch.js</text>
  <text x="1176" y="33" text-anchor="end" class="mono" font-size="13" fill="#6b7fa6">&gt; function setup() {<tspan class="cursor" fill="#38bdf8">_</tspan></text>

  <!-- piano keys (left) -->
  <g transform="translate(26 236)">
    <g fill="#e6edf8" opacity="0.22">
      <rect x="0" width="22" height="64"/><rect x="24" width="22" height="64"/><rect x="48" width="22" height="64"/>
      <rect x="72" width="22" height="64"/><rect x="96" width="22" height="64"/><rect x="120" width="22" height="64"/>
      <rect x="144" width="22" height="64"/><rect x="168" width="22" height="64"/>
    </g>
    <rect class="pulse" x="72" width="22" height="64" fill="#38bdf8" opacity="0.5"/>
    <g fill="#030817">
      <rect x="15" width="14" height="38"/><rect x="39" width="14" height="38"/><rect x="87" width="14" height="38"/>
      <rect x="111" width="14" height="38"/><rect x="135" width="14" height="38"/><rect x="183" width="7" height="38"/>
    </g>
  </g>

  <!-- pixel game sprite (centre) -->
  <g transform="translate(578 236)">
  <g class="hop">
    <g fill="#38bdf8" opacity="0.75">
      <rect x="8" y="0" width="28" height="6"/><rect x="2" y="6" width="40" height="6"/>
      <rect x="2" y="12" width="8" height="8"/><rect x="18" y="12" width="8" height="8"/><rect x="34" y="12" width="8" height="8"/>
      <rect x="2" y="20" width="40" height="6"/><rect x="8" y="26" width="8" height="6"/><rect x="28" y="26" width="8" height="6"/>
    </g>
  </g>
  </g>
  <rect x="520" y="286" width="160" height="2" fill="#38bdf8" opacity="0.35"/>

  <!-- equaliser / waveform (right) -->
  <g transform="translate(940 214)" fill="#2563eb" opacity="0.6">
    <rect class="bar" x="0" y="20" width="10" height="66" style="animation-delay:-.2s"/>
    <rect class="bar" x="16" y="0" width="10" height="86" style="animation-delay:-.6s"/>
    <rect class="bar" x="32" y="30" width="10" height="56" style="animation-delay:-1s"/>
    <rect class="bar" x="48" y="10" width="10" height="76" style="animation-delay:-.4s"/>
    <rect class="bar" x="64" y="36" width="10" height="50" style="animation-delay:-.8s"/>
    <rect class="bar" x="80" y="4" width="10" height="82" style="animation-delay:-1.2s"/>
    <rect class="bar" x="96" y="26" width="10" height="60" style="animation-delay:-.3s"/>
    <rect class="bar" x="112" y="14" width="10" height="72" style="animation-delay:-.9s"/>
    <rect class="bar" x="128" y="40" width="10" height="46" style="animation-delay:-.5s"/>
    <rect class="bar" x="144" y="8" width="10" height="78" style="animation-delay:-1.1s"/>
    <rect class="bar" x="160" y="28" width="10" height="58" style="animation-delay:-.7s"/>
    <rect class="bar" x="176" y="18" width="10" height="68" style="animation-delay:-.1s"/>
    <rect class="bar" x="192" y="34" width="10" height="52" style="animation-delay:-1.3s"/>
    <rect class="bar" x="208" y="12" width="10" height="74" style="animation-delay:-.45s"/>
  </g>

  <!-- side monogram -->
  <text x="30" y="110" class="sans" font-size="22" font-weight="900" fill="#38bdf8" opacity="0.5">A</text>
  <text x="30" y="138" class="sans" font-size="22" font-weight="900" fill="#38bdf8" opacity="0.5">M</text>
  <circle class="pulse" cx="38" cy="158" r="4" fill="#38bdf8"/>

  <!-- title -->
  <text x="600" y="116" text-anchor="middle" class="sans" font-size="54" font-weight="900" letter-spacing="4" fill="url(#title)" filter="url(#glow)">ANITIK AARON MAHARANA</text>
  <text x="600" y="154" text-anchor="middle" class="sans" font-size="19" fill="#e6edf8">Coder  •  Game Developer  •  Multi-Instrumentalist  •  B.Tech CSE (AI &amp; ML)</text>
  <text x="600" y="186" text-anchor="middle" class="mono" font-size="15" letter-spacing="1.5" fill="#7dd3fc">[ CODE, GAMES &amp; MUSIC, NOW SPECIALISING IN AI &amp; ML ]</text>
  <rect x="400" y="198" width="400" height="2" fill="url(#line)"/>
</svg>
