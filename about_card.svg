  </defs>
  <rect x="2" y="2" width="596" height="556" rx="14" fill="#07102a" stroke="url(#border2)" stroke-width="2"/>

  <text x="32" y="50" class="sans" font-size="22" font-weight="700" fill="url(#head)">About Me</text>
  <text x="568" y="50" text-anchor="end" class="mono" font-size="12" fill="#6b7fa6">// from LinkedIn, certificates &amp; repos</text>

  <!-- stat tiles -->
  <g class="sans">
