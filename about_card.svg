<svg width="600" height="560" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About card: internship, education, credentials, music and clubs">
  <style>
    .sans { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
